<!-- The Invenza logo, the same mark as beside the name in the sidebar: a steel tile holding a pane of glass. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 38">
  <defs>
    <linearGradient id="steel" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#e9eef2" />
      <stop offset="1" stop-color="#8e9ba7" />
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fe0f2" />
      <stop offset="1" stop-color="#1a8fae" />
    </linearGradient>
    <clipPath id="pane">
      <rect x="8" y="8" width="22" height="22" rx="5" />
    </clipPath>
  </defs>
  <rect width="38" height="38" rx="10" fill="url(#steel)" />
  <rect x="0.5" y="0.5" width="37" height="37" rx="9.5" fill="none" stroke="#fff" stroke-opacity="0.5" />
  <rect x="8" y="8" width="22" height="22" rx="5" fill="url(#glass)" />
  <!-- the shine across the top-left corner of the glass -->
  <path d="M8 8 H22 L12 25.3 L8 23 Z" fill="#fff" fill-opacity="0.6" clip-path="url(#pane)" />
</svg>
