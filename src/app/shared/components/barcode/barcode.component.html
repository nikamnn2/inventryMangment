@if (shape(); as s) {
  <svg [attr.viewBox]="'0 0 ' + s.width + ' 1'" preserveAspectRatio="none" role="img" [attr.aria-label]="'Barcode ' + value()" [style.height.px]="height()" [style.width.px]="s.width * moduleWidth()">
    <rect [attr.width]="s.width" height="1" fill="#fff" />
    @for (b of s.bars; track b.x) { <rect [attr.x]="b.x" [attr.width]="b.w" height="1" fill="#000" /> }
  </svg>
} @else {
  <span class="bad">Cannot encode "{{ value() }}"</span>
}
